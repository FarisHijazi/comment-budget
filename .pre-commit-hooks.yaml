- id: comment-budget
  name: comment budget
  description: Fail when the repo's comment-line count exceeds the integer in .comment-budget.
  entry: comment_budget.py
  language: script
  pass_filenames: false
  always_run: true
- id: comment-budget-write
  name: comment budget (lower to current count)
  description: Rewrite .comment-budget to the current count; refuses to raise it.
  entry: comment_budget.py --write
  language: script
  pass_filenames: false
  always_run: true
  stages: [manual]
